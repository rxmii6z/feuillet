[package]
name = "feuillet"
version = "1.0.0"
description = "Éditeur Markdown pour Windows 11, avec mise en page A4 et export PDF"
authors = ["Les contributeurs de Feuillet"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ammonia = "4.2.5"
comrak = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
winreg = "0.56.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
